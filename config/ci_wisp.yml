# Pipeline de integración continua propuesto para el repositorio Wisp-ISP.
# Destino: .github/workflows/ci.yml  (aún NO activado en el repositorio).
# Se ejecuta en cada push y pull request a main y pastor.
name: CI

on:
  push:
    branches: [main, pastor]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest pytest-cov ruff
      - name: Análisis estático (errores reales, sin estilo)
        run: ruff check app --select F,B904,E711,E712 --ignore B008
      - name: Pruebas unitarias y de caja blanca con cobertura
        run: python -m pytest -q tests/ --cov=app --cov-branch --cov-report=xml --junitxml=junit.xml
      - name: Umbral de cobertura en reglas críticas
        run: python -m coverage report --include="app/acceso.py,app/billing.py,app/facturacion.py" --fail-under=100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-backend
          path: backend/junit.xml

  migraciones:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: wisp_ci
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ci" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/wisp_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - name: Migraciones de ida, vuelta e ida
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tipos y compilación de producción
        run: npm run build

  imagenes:
    needs: [backend, migraciones, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Las imágenes Docker se construyen
        run: docker compose -f docker-compose.yml build backend frontend web whatsapp

# Despliegue (CD): el servidor está en la oficina detrás de Cloudflare Tunnel, sin puertos
# abiertos, así que no se empuja desde GitHub. Se propone que el servidor tire de main:
#   cron cada 15 min ->  scripts/actualizar.sh
#   git fetch; si origin/main avanzó y su CI pasó: git tag previo, pull, compose up -d --build,
#   verificar /api/health; si falla, git checkout del tag previo y compose up -d --build.
